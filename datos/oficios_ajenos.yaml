# Contrato v49 (26 nov): palabras del TÍTULO que delatan otro sector cuando el cargo coincide solo por el nombre.
# No descartan nada. Solo cuentan si la descripción no trae NINGUNA función del cargo: entonces la vacante no se entrega
# sola y va a «Por confirmar» («Título coincide; funciones de otro oficio»), donde el operador decide con un clic.
# Si la palabra forma parte del nombre del cargo, de sus términos o de sus funciones, no cuenta para ese cargo
# (un cargo «QA de manufactura» no se señala a sí mismo).
# Ejemplos medidos el 25 nov: «QA Manufacturing Analyst» y «Battery Test Engineer» como QA de software; «Product
# Designer – Kids' Drinkware» y «Outerwear Design Manager» como diseño de producto digital; «LCL Product Manager – Ocean
# Freight» y «Global Product Manager – Sustainable Seafood» como Product Manager de software.
# En minúsculas y sin tildes; `python -m pytest` revisa el formato.

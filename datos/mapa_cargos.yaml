# Mapa de cargos. Cada familia agrupa un cargo con sus parecidos para que una búsqueda traiga volumen:
#   exactos:      el mismo cargo en español, inglés y portugués
#   similares:    cargos que hacen casi lo mismo
#   cercanos:     cargos vecinos que también le pueden servir a la persona
#   herramientas: palabras del oficio en la descripción; con 2 o más y una palabra de `genericos` en el título, la
#                 vacante entra como cercana aunque su título sea raro ("Editor" que pide Premiere y CapCut)
#   genericos:    palabras sueltas del oficio en el título (editor, diseñador, desarrollador…)
#   excluir:      palabras del título que delatan otro oficio con nombre parecido ("UI Artist" de videojuegos)
#   consultas:    lo que se le pide a las fuentes (pocas, para que cueste menos); en LinkedIn van unidas con OR
# No escribas niveles (junior, senior, lead…): el programa los quita y los guarda aparte. Mayúsculas y tildes dan igual.
# Para agregar una familia o un título: skill `nueva-familia` o editar aquí; `python -m pytest` revisa el formato.


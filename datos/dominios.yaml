# Qué tipo de sitio es cada enlace. Se compara con el dominio (y subdominios) del enlace.
#   originales: sistemas de postulación de las empresas. Se postula ahí y es el aviso real.
#   portales:   bolsas de empleo donde se postula en el mismo sitio (no son copias).
#   agregadores: sitios que copian avisos de otros o cobran. Nunca se entregan: se busca el original y si no aparece,
#                la vacante no se guarda.
# Una entrada sin punto ("computrabajo") vale para el sitio de cualquier país (computrabajo.com.co, .com.mx…).
# Un dominio que no está en ninguna lista cuenta como página de empleo de la empresa si su dirección lo parece
# (careers., jobs., /empleos, /trabaja-con-nosotros…); si no, queda como "desconocido" y va al final.


# Fechas que caducan y que nadie recuerda (P-13.1, Vigía de avisos). Solo nombres públicos y fechas: NUNCA el valor
# de una clave. El Vigía (buscador/vigia.py) avisa con antelación y el texto de cada entrada sale tal cual en
# el issue público de GitHub. Por eso `nombre` y `paso` solo admiten letras, cifras y signos sencillos (sin @,
# sin enlaces) y el Vigía rechaza la entrada si no cumplen.
#
# tipo: soporte (fin de soporte de una pieza: aviso 180 días antes) · clave (una credencial que caduca: 30 días antes).
# `aviso_dias` cambia esa antelación para una entrada concreta.
#
# `revisado`: la fecha en que una persona miró esta lista por última vez. Cambiarla es además la forma más simple de
# hacer un commit en `main` desde la web de GitHub cuando el Vigía avisa de que faltan días para que GitHub apague los
# horarios por falta de actividad (regla de los 60 días de los repositorios públicos).
revisado: 2026-11-28


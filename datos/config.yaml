# Configuración del buscador. Aquí no van claves: esas son secretos de GitHub (APIFY_TOKEN, SUPABASE_*). Lo que se cambia aquí lo lee la bodega en su próxima corrida.

# Países que se buscan: LATAM y España (códigos ISO; el detalle de cada uno vive en datos/paises.yaml desde el paso 2)
paises_activos: [AR, BO, CL, CO, CR, CU, DO, EC, ES, GT, HN, MX, NI, PA, PE, PR, PY, SV, UY, VE]

# Contrato v16: lectura de la ficha pública para confirmar la ubicación de vacantes «por confirmar» del cargo de algún
# rol (datos estructurados JobPosting). Solo GET, sin Apify; lo leído se recuerda 7 días en trabajo/ubicacion_fichas.json.
confirmar_ubicacion:  # contrato v29: el doble de fichas para que lleguen menos a «Por confirmar»
  fichas_por_corrida: 300
  segundos: 480

# Vacantes más viejas que esto se borran de la bodega
dias_maximos: 30

# Hora de la bodega nocturna en Bogotá (UTC−5). El horario real está en .github/workflows/bodega.yml (paso 7).
hora_bodega_bogota: "06:30"

# GET de fichas y enlaces de aplicación visibles. No consume Apify ni envía formularios.
verificacion_enlaces:
  vacantes_por_corrida: 800  # contrato v39 (17 nov): antes 400 en 6 min; 73 de 100 Product Designer útiles quedaron sin comprobar
  segundos_corrida: 600
  vacantes_por_captura: 120
  segundos_captura: 180

# Captura horaria gratuita, independiente de la entrega. Activación tras migración del catálogo v2.
incremental:
  minutos_por_fuente: 2
  linkedin_busquedas: 24
  linkedin_fichas: 48
  linkedin_relectura: 48     # avisos guardados sin descripción que se releen cada hora (sin ella no se pueden entregar)
  indeed_busquedas: 6
  ats_detalles: 20
  rotacion_empresas: 30

# Si un rol queda bajo 20, buscar variantes adicionales en fuentes gratuitas.
# No se ejecuta en --prueba ni búsqueda profunda. No relaja requisitos ni repite ofertas.
refuerzo:
  rondas: 2
  minutos_por_fuente: 3
  linkedin_busquedas: 18
  linkedin_fichas: 60
  indeed_busquedas: 6
  getonbrd_busquedas: 6

# Apify: crédito gratuito de hasta USD 5 por mes calendario para ofertas formales de LinkedIn.
# Actor comprobado contra su esquema público; no se envían cookies ni sesión personal.
# Las reservas conservadoras de cargo se guardan en trabajo/apify_presupuesto.json antes de cada ejecución.
# Se reparte el tope mensual entre los días del mes, además del límite por consulta y corrida.
# La búsqueda pagada del feed queda desactivada para priorizar las fichas formales con este crédito.
apify:
  actor_publicaciones: "harvestapi/linkedin-post-search"
  publicaciones_por_dia: 0  # reservar el crédito gratuito para fichas de empleo
  actor_linkedin: "curious_coder/linkedin-jobs-scraper"
  rescate_busquedas: 4         # modo panel: búsquedas dirigidas a perfiles con menos de 5 (≈60 % del crédito diario)
  posts_rescate: 50            # modo panel: posts de LinkedIn para quien sigue bajo 5 (≈USD 0,11; contratos v11 y v28)
  build_linkedin: "1.7.18"
  ofertas_por_busqueda: 10
  tope_consulta_usd: 0.025
  tope_mensual_usd: 5
  actor_linkedin_respaldo: ""
  tope_por_corrida_usd: 3

# Cuánto trabaja cada fuente por corrida. Más alto = más vacantes, pero más tiempo y más riesgo de bloqueo (LinkedIn).
# Las fuentes corren en paralelo; cada una se detiene sola al llegar a minutos_por_fuente.
presupuestos:
  minutos_por_fuente: 50
  linkedin_busquedas: 450      # páginas de resultados por noche (10 avisos cada una)
  linkedin_fichas: 450         # avisos a los que se les lee la descripción completa
  linkedin_relectura: 300      # avisos ya guardados sin descripción que se releen tras la búsqueda
  computrabajo_busquedas: 60   # páginas de resultados de Computrabajo (17 países; se postula en el mismo portal)
  computrabajo_fichas: 300     # fichas de Computrabajo a las que se les lee la descripción (v49: solo las de un cargo buscado; antes 150 de cualquiera)
  computrabajo_relectura: 200  # v49: avisos de Computrabajo ya guardados sin descripción que se releen tras la búsqueda
  elempleo_busquedas: 20       # búsquedas en Elempleo (Colombia; se postula en el mismo portal; PR 1b)
  elempleo_fichas: 80          # fichas de Elempleo que se leen (fecha, salario y modalidad estructurados)
  infojobs_busquedas: 5        # v50: páginas de búsqueda de InfoJobs (España) por corrida; a la sexta pide captcha y la fuente se detiene
  infojobs_api_busquedas: 40   # v50: con la clave de la API oficial de InfoJobs (docs/ACTIVAR_INFOJOBS_API.md): búsquedas por corrida
  infojobs_api_fichas: 150     # v50: fichas de la API que se leen (solo de títulos de un cargo buscado)
  tecnoempleo_busquedas: 20    # v50: búsquedas en Tecnoempleo (España, tecnología; se postula en el mismo portal)
  tecnoempleo_fichas: 80       # v50: fichas de Tecnoempleo que se leen (solo de títulos de un cargo buscado)
  jobint_busquedas: 120        # v50: búsquedas en Bumeran (AR, MX, PE, VE), Laborum (CL), Multitrabajos (EC) y Konzerta (PA)
  hireline_fichas: 60          # v44: fichas de Hireline (México y Colombia, tecnología; sitemap + JobPosting)
  magneto_fichas: 60           # v44: fichas de Magneto (Colombia; sitemap + JobPosting)
  pausa_linkedin: [1.0, 2.5]   # segundos entre peticiones a LinkedIn
  indeed_busquedas: 90
  # Contrato v50: en la búsqueda de cada noche del panel, Indeed repasa los 30 días completos de cada cargo y país
  # (así sus avisos vuelven a «verse hoy» y cuentan como comprobados). Nombres del cargo por combinación (los de
  # español aparte), resultados por búsqueda y tope de tiempo. No aplica a la captura horaria, al refuerzo ni a «Buscar
  # ahora» para quien falta.
  indeed_repaso: {nombres: 4, nombres_es: 8, resultados: 100, minutos: 10}
  apify_busquedas: 60          # solo con APIFY_TOKEN
  remotos_paginas: 250         # páginas de tableros remotos que se abren para encontrar el original
  empresas_por_probar: 80      # empresas nuevas que se prueban en los sistemas de postulación
  getonbrd_busquedas: 60

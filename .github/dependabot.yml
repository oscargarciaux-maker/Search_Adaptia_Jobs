# PR 1.5 (16 nov): GitHub propone cada semana las actualizaciones de librerías y de acciones, como PR que pasan por
# todas las pruebas antes de que Oscar los fusione. Nada se actualiza solo.
# Python: requirements.in (lo que pedimos) → requirements.txt (pip-compile, con huellas); Dependabot actualiza ambos.
# Las versiones mayores (cambios que pueden romper) no se proponen solas: se hacen a propósito en un PR revisado.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # P-5b (28 nov): un solo PR semanal con todas las librerías de Python (antes llegaban 5 sueltos, #144–#148) y las
    # de seguridad aparte, para que un aviso de seguridad no espere a la revisión semanal. Un grupo por nombre; si una
    # librería encaja en dos, va al primero. Las versiones mayores siguen ignoradas.
    groups:
      python-seguridad:
        applies-to: security-updates
        patterns: ["*"]
      python-semanal:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      desarrollo:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

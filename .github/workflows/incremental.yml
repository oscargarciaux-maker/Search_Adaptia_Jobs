name: Captura horaria

# 18 nov: además de capturar, vigila que la búsqueda diaria haya corrido. Si después de las 7:00 de Bogotá GitHub no
# la lanzó, el trabajo «vigia» la lanza una vez (buscador/arranque.py). Solo lee fechas, sin datos de clientes.

on:
  schedule:
    - cron: "23 * * * *" # evitar el minuto cero, propenso a retrasos de Actions
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo capturar en temporal, sin Supabase ni publicar"
        type: boolean
        default: true
      reloj:
        description: "La pidió el Reloj (v51): se trata como la captura programada, no como una hecha a mano"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Recuperar catálogo y memoria
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if git ls-remote --exit-code --heads origin publicado; then
            git clone --depth 1 --branch publicado "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" salida
            rm -rf salida/.git
          else
            mkdir -p salida
          fi
          # El detalle por cargo vive en Supabase (tabla estado_trabajo): se repone antes de seguir.
          python -m buscador.estado_privado traer --salida salida
      - name: Preparar base y comprobar habilitación
        id: preparar
        uses: ./.github/actions/preparar-supabase
        with:
          conexion: ${{ secrets.SUPABASE_DB_URL }}
          clave_respaldo: ${{ secrets.SUPABASE_BACKUP_KEY }}
          url: ${{ secrets.SUPABASE_URL }}
          clave_rest: ${{ secrets.SUPABASE_SECRET_KEY }}
          modo: incremental
          prueba: ${{ inputs.prueba || false }}
          manual: ${{ github.event_name == 'workflow_dispatch' && !inputs.reloj }}
          captura: ${{ vars.CAPTURA_HORARIA_ACTIVA }}
          central: ${{ vars.ESTADO_SUPABASE_ACTIVO }}
      - name: Capturar sin crear entrega diaria ni consumir Apify
        if: steps.preparar.outputs.ejecutar == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m panel.ejecutor --salida salida --modo incremental ${{ inputs.prueba && '--prueba' || '' }}
      - name: Separar el detalle por cargo (privado, en Supabase) antes de publicar
        # Auditoría de exposición (#2, #4): la rama publicado y el artefacto quedan solo con cifras agregadas.
        # Si la corrida falló, se guarda aparte («fallida») y la siguiente sigue con el estado anterior.
        if: ${{ always() && !inputs.prueba && steps.preparar.outputs.ejecutar == 'true' && hashFiles('salida/trabajo/bodega.json.gz') != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m buscador.estado_privado guardar --salida salida ${{ job.status != 'success' && '--fallida' || '' }}
      - name: Conservar estado de recuperación
        if: ${{ always() && !inputs.prueba && steps.preparar.outputs.ejecutar == 'true' && hashFiles('salida/trabajo/bodega.json.gz') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: estado-captura-${{ github.run_id }}
          path: salida/trabajo/
          retention-days: 14
      - name: Actualizar catálogo publicado
        if: ${{ !inputs.prueba && steps.preparar.outputs.ejecutar == 'true' }}
        working-directory: salida
        run: |
          git init -q
          git checkout -q -b publicado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Captura $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" publicado
      - name: Comprobar sincronización del catálogo
        if: ${{ !inputs.prueba && steps.preparar.outputs.ejecutar == 'true' }}
        run: python -m buscador.validacion --salida privado/estado_trabajo --catalogo
      - name: Avisar
        if: always()
        env:
          AVISO: ${{ secrets.AVISO_CAPTURA_URL }}
        run: |
          if [ -n "$AVISO" ] && [ "${{ inputs.prueba }}" != "true" ]; then
            if [ "${{ job.status }}" = "success" ]; then curl -fsS -m 10 --retry 3 "$AVISO" >/dev/null || true
            else curl -fsS -m 10 --retry 3 "$AVISO/fail" >/dev/null || true; fi
          fi
  vigia:
    # Solo en la corrida programada: una prueba a mano no lanza nada.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # solo para lanzar bodega.yml con workflow_dispatch
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Lanzar la búsqueda diaria si GitHub no la arrancó
        id: vigia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rama=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
          echo "rama=$rama" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/trabajo"
          if git fetch -q --depth 1 origin publicado; then
            git show FETCH_HEAD:trabajo/metricas_entrega.json > "$RUNNER_TEMP/trabajo/metricas_entrega.json" 2>/dev/null || true
          fi
          gh run list --workflow bodega.yml --limit 40 --json createdAt,conclusion,event,headBranch,status > "$RUNNER_TEMP/corridas.json"
          python3 -m buscador.arranque --trabajo "$RUNNER_TEMP/trabajo" --vigia "$RUNNER_TEMP/corridas.json" \
            --rama "$rama" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Lanzar bodega.yml
        if: steps.vigia.outputs.lanzar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run bodega.yml --ref "${{ steps.vigia.outputs.rama }}" -f modo=diario -f prueba=false

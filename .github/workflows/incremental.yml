name: Captura horaria

on:
  schedule:
    - cron: "23 * * * *" # evitar el minuto cero, propenso a retrasos de Actions
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo capturar en temporal, sin Supabase ni publicar"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  captura:
    if: ${{ vars.CAPTURA_HORARIA_ACTIVA == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recuperar catálogo y memoria
        run: |
          if git ls-remote --exit-code --heads origin publicado; then
            git clone --depth 1 --branch publicado "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" salida
            rm -rf salida/.git
          else
            mkdir -p salida
          fi
      - name: Capturar sin crear entrega diaria ni consumir Apify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ESTADO_SUPABASE_ACTIVO: ${{ vars.ESTADO_SUPABASE_ACTIVO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m buscador.bodega --salida salida --modo incremental ${{ inputs.prueba && '--prueba' || '' }}
      - name: Conservar estado de recuperación
        if: ${{ always() && !inputs.prueba && hashFiles('salida/trabajo/estado.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: estado-captura-${{ github.run_id }}
          path: salida/trabajo/
          retention-days: 14
      - name: Actualizar catálogo publicado
        if: ${{ !inputs.prueba }}
        working-directory: salida
        run: |
          git init -q
          git checkout -q -b publicado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Captura $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" publicado
      - name: Comprobar sincronización del catálogo
        if: ${{ !inputs.prueba }}
        run: python -m buscador.validacion --salida salida --catalogo

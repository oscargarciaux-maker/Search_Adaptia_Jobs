name: Captura horaria

on:
  schedule:
    - cron: "23 * * * *" # evitar el minuto cero, propenso a retrasos de Actions
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo capturar en temporal, sin Supabase ni publicar"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recuperar catálogo y memoria
        run: |
          if git ls-remote --exit-code --heads origin publicado; then
            git clone --depth 1 --branch publicado "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" salida
            rm -rf salida/.git
          else
            mkdir -p salida
          fi
      - name: Preparar base y comprobar habilitación
        id: preparar
        uses: ./.github/actions/preparar-supabase
        with:
          conexion: ${{ secrets.SUPABASE_DB_URL }}
          clave_respaldo: ${{ secrets.SUPABASE_BACKUP_KEY }}
          url: ${{ secrets.SUPABASE_URL }}
          clave_rest: ${{ secrets.SUPABASE_SECRET_KEY }}
          modo: incremental
          prueba: ${{ inputs.prueba || false }}
          manual: ${{ github.event_name == 'workflow_dispatch' }}
          captura: ${{ vars.CAPTURA_HORARIA_ACTIVA }}
          central: ${{ vars.ESTADO_SUPABASE_ACTIVO }}
      - name: Capturar sin crear entrega diaria ni consumir Apify
        if: steps.preparar.outputs.ejecutar == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m panel.ejecutor --salida salida --modo incremental ${{ inputs.prueba && '--prueba' || '' }}
      - name: Conservar estado de recuperación
        if: ${{ always() && !inputs.prueba && steps.preparar.outputs.ejecutar == 'true' && hashFiles('salida/trabajo/estado.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: estado-captura-${{ github.run_id }}
          path: salida/trabajo/
          retention-days: 14
      - name: Actualizar catálogo publicado
        if: ${{ !inputs.prueba && steps.preparar.outputs.ejecutar == 'true' }}
        working-directory: salida
        run: |
          git init -q
          git checkout -q -b publicado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Captura $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" publicado
      - name: Comprobar sincronización del catálogo
        if: ${{ !inputs.prueba && steps.preparar.outputs.ejecutar == 'true' }}
        run: python -m buscador.validacion --salida salida --catalogo
      - name: Alertas por correo
        if: ${{ always() && !inputs.prueba && steps.preparar.outputs.ejecutar == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTAS_REMITENTE: ${{ vars.ALERTAS_REMITENTE }}
          PANEL_ORIGIN: ${{ vars.PANEL_URL }}
        run: python -m buscador.alertas --salida salida --modo horaria --resultado ${{ job.status }}
      - name: Avisar
        if: always()
        env:
          AVISO: ${{ secrets.AVISO_CAPTURA_URL }}
        run: |
          if [ -n "$AVISO" ] && [ "${{ inputs.prueba }}" != "true" ]; then
            if [ "${{ job.status }}" = "success" ]; then curl -fsS -m 10 --retry 3 "$AVISO" >/dev/null || true
            else curl -fsS -m 10 --retry 3 "$AVISO/fail" >/dev/null || true; fi
          fi

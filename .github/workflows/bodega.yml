name: Bodega nocturna

# Usa la versión activa del panel (o seis cargos por veinte en legado), conserva catálogo y entrega en Supabase.
# La rama publicado contiene estado y reportes técnicos, sin interfaz privada.
# Cada día a las 6:30 a. m. de Bogotá (11:30 UTC; antes 1:17, cambio del 13 nov). A mano: Actions > Bodega nocturna >
# Run workflow. Segunda pasada a las 8:30 a. m. de Bogotá (13:30 UTC): solo trabaja si la nocturna no llegó a la meta, no confirmó Supabase
# o no corrió; completa el mismo lote del día (no elige otro) y no supera el tope diario de Apify ya reservado.
# Aviso opcional: secreto AVISO_NOCTURNA_URL (ping de Healthchecks u otro servicio similar).
#   modo "inicial": olvida la rotación y pide 30 días a cada combinación (para la primera vez o tras un cambio grande)
#   prueba: presupuestos mínimos (unos 5 minutos), para comprobar que todo funciona
on:
  schedule:
    - cron: "30 11 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "diario o inicial"
        type: choice
        options: [diario, inicial]
        default: diario
      prueba:
        description: "Corrida corta de prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  bodega:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Traer la corrida anterior (rama publicado)
        run: |
          if git ls-remote --exit-code --heads origin publicado; then
            git clone --depth 1 --branch publicado "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" salida
            rm -rf salida/.git
          else
            mkdir -p salida
          fi
          # No mostrar el reporte viejo como resultado de una primera corrida fallida.
          rm -f salida/datos/salud.json
      - name: Decidir si hace falta la pasada de la mañana
        id: decidir
        run: |
          if [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then
            python -m buscador.validacion --salida salida --hace-falta-completar >> "$GITHUB_OUTPUT"
          else
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Preparar base y estado automáticamente
        if: ${{ steps.decidir.outputs.ejecutar == 'true' }}
        uses: ./.github/actions/preparar-supabase
        with:
          conexion: ${{ secrets.SUPABASE_DB_URL }}
          clave_respaldo: ${{ secrets.SUPABASE_BACKUP_KEY }}
          url: ${{ secrets.SUPABASE_URL }}
          clave_rest: ${{ secrets.SUPABASE_SECRET_KEY }}
          modo: diario
          prueba: ${{ inputs.prueba || false }}
          captura: ${{ vars.CAPTURA_HORARIA_ACTIVA }}
          central: ${{ vars.ESTADO_SUPABASE_ACTIVO }}
      - name: Buscar y limpiar
        if: ${{ steps.decidir.outputs.ejecutar == 'true' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m panel.ejecutor --salida salida --modo "${{ inputs.modo || 'diario' }}" ${{ inputs.prueba && '--prueba' || '' }}
      - name: Publicar en la rama publicado
        if: ${{ steps.decidir.outputs.ejecutar == 'true' && !inputs.prueba }}
        working-directory: salida
        run: |
          git init -q
          git checkout -q -b publicado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Bodega $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" publicado
      - name: Conservar estado para diagnóstico y recuperación
        if: ${{ steps.decidir.outputs.ejecutar == 'true' && always() && !inputs.prueba && hashFiles('salida/trabajo/estado.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: estado-bodega-${{ github.run_id }}
          path: salida/trabajo/
          retention-days: 14
      - name: Comprobar meta y sincronización
        if: ${{ steps.decidir.outputs.ejecutar == 'true' && !inputs.prueba }}
        run: python -m buscador.validacion --salida salida
      - name: Resumen
        if: ${{ always() && steps.decidir.outputs.ejecutar == 'true' }}
        run: |
          test -f salida/datos/salud.json && python -c "
          import json; s=json.load(open('salida/datos/salud.json'))
          print(f\"Vacantes en la bodega: {s['vacantes_en_bodega']} · nuevas hoy: {s['nuevas_hoy']} · {s['minutos']} min\")
          [print(f'  {k}: {v}') for k, v in s['fuentes'].items()]
          e = s.get('entrega') or {}
          print(f\"Verificación de enlaces: {s.get('verificacion_enlaces', {})}\")
          print(f\"Selección histórica del día: {e.get('vacantes', 0)} vacantes, {e.get('filas', 0)} filas · Supabase: {e.get('supabase')}\")
          [print(f\"  {r['nombre']}: {r['entregadas']} (faltaron {r['faltan']})\") for r in (e.get('roles') or {}).values()]
          print('Disponibilidad observada en esta captura:')
          for r in ((s.get('seleccion_actual') or {}).get('roles') or {}).values():
              listas=sum(v.get('catalog_status')=='active' and v.get('afinidad_vigente') is True and (v.get('verificacion') or {}).get('estado')=='verificada' for v in r.get('vacantes',[]))
              print('{}: {} listas; {} faltantes vigentes frente a la meta'.format(r['nombre'],listas,max(0,r.get('meta',20)-listas)))
          " >> "$GITHUB_STEP_SUMMARY" || true
      - name: Alertas por correo
        if: ${{ always() && !inputs.prueba && steps.decidir.outputs.ejecutar == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTAS_REMITENTE: ${{ vars.ALERTAS_REMITENTE }}
          PANEL_ORIGIN: ${{ vars.PANEL_URL }}
        run: python -m buscador.alertas --salida salida --modo ${{ github.event.schedule == '30 13 * * *' && 'manana' || 'diario' }} --resultado ${{ job.status }}
      - name: Avisar
        if: always()
        env:
          AVISO: ${{ secrets.AVISO_NOCTURNA_URL }}
        run: |
          if [ -n "$AVISO" ] && [ "${{ inputs.prueba }}" != "true" ]; then
            if [ "${{ job.status }}" = "success" ]; then curl -fsS -m 10 --retry 3 "$AVISO" >/dev/null || true
            else curl -fsS -m 10 --retry 3 "$AVISO/fail" >/dev/null || true; fi
          fi

name: Bodega nocturna

# Recoge vacantes de todas las fuentes, limpia, guarda 30 días, arma la entrega diaria (20 nuevas por rol, formato del
# contrato de datos v1) y la guarda en Supabase, y publica la página con los datos en la rama `publicado`.
# Cada noche a la 1:17 de Bogotá (6:17 UTC). A mano: Actions > Bodega nocturna > Run workflow.
#   modo "inicial": olvida la rotación y pide 30 días a cada combinación (para la primera vez o tras un cambio grande)
#   prueba: presupuestos mínimos (unos 5 minutos), para comprobar que todo funciona
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "diario o inicial"
        type: choice
        options: [diario, inicial]
        default: diario
      prueba:
        description: "Corrida corta de prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  bodega:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Traer la corrida anterior (rama publicado)
        run: |
          if git ls-remote --exit-code --heads origin publicado; then
            git clone --depth 1 --branch publicado "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" salida
            rm -rf salida/.git
          else
            mkdir -p salida
          fi
          # No mostrar el reporte viejo como resultado de una primera corrida fallida.
          rm -f salida/datos/salud.json
      - name: Preparar base y estado automáticamente
        uses: ./.github/actions/preparar-supabase
        with:
          conexion: ${{ secrets.SUPABASE_DB_URL }}
          clave_respaldo: ${{ secrets.SUPABASE_BACKUP_KEY }}
          url: ${{ secrets.SUPABASE_URL }}
          clave_rest: ${{ secrets.SUPABASE_SECRET_KEY }}
          modo: diario
          prueba: ${{ inputs.prueba || false }}
          captura: ${{ vars.CAPTURA_HORARIA_ACTIVA }}
          central: ${{ vars.ESTADO_SUPABASE_ACTIVO }}
      - name: Buscar y limpiar
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m buscador.bodega --salida salida --modo "${{ inputs.modo || 'diario' }}" ${{ inputs.prueba && '--prueba' || '' }}
      - name: Publicar en la rama publicado
        if: ${{ !inputs.prueba }}
        working-directory: salida
        run: |
          git init -q
          git checkout -q -b publicado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Bodega $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" publicado
      - name: Conservar estado para diagnóstico y recuperación
        if: ${{ always() && !inputs.prueba && hashFiles('salida/trabajo/estado.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: estado-bodega-${{ github.run_id }}
          path: salida/trabajo/
          retention-days: 14
      - name: Comprobar meta y sincronización
        if: ${{ !inputs.prueba }}
        run: python -m buscador.validacion --salida salida
      - name: Resumen
        if: always()
        run: |
          test -f salida/datos/salud.json && python -c "
          import json; s=json.load(open('salida/datos/salud.json'))
          print(f\"Vacantes en la bodega: {s['vacantes_en_bodega']} · nuevas hoy: {s['nuevas_hoy']} · {s['minutos']} min\")
          [print(f'  {k}: {v}') for k, v in s['fuentes'].items()]
          e = s.get('entrega') or {}
          print(f\"Verificación de enlaces: {s.get('verificacion_enlaces', {})}\")
          print(f\"Entrega del día: {e.get('vacantes', 0)} vacantes, {e.get('filas', 0)} filas · Supabase: {e.get('supabase')}\")
          [print(f\"  {r['nombre']}: {r['entregadas']} (faltaron {r['faltan']})\") for r in (e.get('roles') or {}).values()]" >> "$GITHUB_STEP_SUMMARY" || true

name: Reloj

# Contrato v51 (27 nov). Desde el 17 nov GitHub solo dispara los horarios (cron) de este repositorio cada 8 a 12 horas:
# la búsqueda de las 6:30 a. m. de Bogotá arrancaba por la tarde y la «Captura horaria» corría 2 a 4 veces al día. Lo
# que se pide (workflow_dispatch) sí arranca al momento. Este flujo es un reloj hecho de relevos: cada corrida espera
# con el temporizador del entorno `reloj` (30 minutos; la espera no ocupa una máquina), pide el siguiente relevo y lanza
# lo que toque (buscador/arranque.py): la captura de la hora y, desde las 6:30 a. m. de Bogotá, la búsqueda diaria si
# hoy no corrió. Solo lee fechas y estados de corridas, sin datos de clientes.
#
# Activarlo una vez: Settings → Environments → New environment «reloj» → Wait timer 30 (docs/ACTIVAR_RELOJ.md), y
# después Actions → Reloj → Run workflow. Sin el temporizador el relevo no sigue (no gira sin pausa).
# Una vez al día pide también el «Vigía de avisos» (vigia.yml, P-13.1).
# Si la cadena se corta la reanudan el horario de abajo (cuando GitHub lo dispare) y cualquier búsqueda real, incluida
# «Buscar ahora» (trabajo «reloj» de bodega.yml). Para detenerlo: Actions → Reloj → «Disable workflow».

on:
  workflow_dispatch:
    inputs:
      origen:
        description: "manual (una persona), relevo o reanudar (los pone el propio sistema)"
        type: choice
        options: [manual, relevo, reanudar]
        default: manual
  schedule:
    - cron: "53 * * * *" # respaldo: reanuda la cadena cuando GitHub dispare un horario

permissions:
  actions: write # solo para pedir reloj.yml, incremental.yml y bodega.yml con workflow_dispatch
  contents: read

jobs:
  relevo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: reloj # su temporizador de espera es la pausa entre relevos
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Decidir qué toca
        id: decidir
        run: |
          # Un tropiezo de la API de GitHub no debe cortar la cadena: cada consulta se intenta hasta tres veces.
          pedir() { for intento in 1 2 3; do "$@" && return 0; sleep 10; done; return 1; }
          rama=$(pedir gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
          echo "rama=$rama" >> "$GITHUB_OUTPUT"
          datos="$RUNNER_TEMP/reloj"
          mkdir -p "$datos/trabajo"
          if git fetch -q --depth 1 origin publicado; then
            git show FETCH_HEAD:trabajo/metricas_entrega.json > "$datos/trabajo/metricas_entrega.json" 2>/dev/null || true
          fi
          campos=databaseId,status,conclusion,createdAt,event,headBranch
          pedir gh run list --workflow reloj.yml --limit 60 --json "$campos" > "$datos/relojes.json"
          pedir gh run list --workflow bodega.yml --limit 40 --json "$campos" > "$datos/diarias.json"
          pedir gh run list --workflow incremental.yml --limit 20 --json "$campos" > "$datos/capturas.json"
          # Una búsqueda «cancelled» puede no haber empezado (GitHub la quitó de la cola: no tiene trabajos) o haberse
          # cortado en marcha (tope de tiempo, o alguien la canceló). Solo la primera se vuelve a pedir. Si no se
          # puede saber, se cuenta como empezada (lo prudente).
          for id in $(jq -r '[.[] | select(.conclusion == "cancelled")][:8][] | .databaseId' "$datos/diarias.json"); do
            pasos=$(pedir gh run view "$id" --json jobs -q '[.jobs[] | select(.name == "bodega") | (.steps | length)] | add // 0') || pasos=1
            if [ "${pasos:-1}" = "0" ]; then empezo=false; else empezo=true; fi
            jq --argjson id "$id" --argjson empezo "$empezo" \
              'map(if .databaseId == $id then . + {empezo: $empezo} else . end)' "$datos/diarias.json" > "$datos/tmp.json"
            mv "$datos/tmp.json" "$datos/diarias.json"
          done
          python3 -m buscador.arranque --trabajo "$datos/trabajo" --reloj "$datos" --yo "$GITHUB_RUN_ID" \
            --rama "$rama" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Pedir el siguiente relevo
        # Primero: si algo falla después, la cadena ya sigue. Se intenta tres veces; si salieran dos relevos, solo
        # sigue el de número más alto.
        if: steps.decidir.outputs.seguir == 'true'
        env:
          RAMA: ${{ steps.decidir.outputs.rama }}
        run: |
          for intento in 1 2 3; do
            gh workflow run reloj.yml --ref "$RAMA" -f origen=relevo && exit 0
            sleep 10
          done
          exit 1
      - name: Pedir la búsqueda diaria
        id: diaria
        if: steps.decidir.outputs.diaria == 'true'
        env:
          RAMA: ${{ steps.decidir.outputs.rama }}
        run: |
          # Si no se puede pedir (p. ej. alguien desactivó «Bodega nocturna» para no buscar hoy) se avisa sin poner
          # el relevo en rojo, y la captura de la hora se pide igual.
          if ! gh workflow run bodega.yml --ref "$RAMA" -f modo=diario -f prueba=false; then
            echo "::warning::No se pudo pedir la búsqueda diaria (¿el flujo «Bodega nocturna» está desactivado?)."
            echo "fallo=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pedir la captura horaria
        if: steps.decidir.outputs.captura == 'true' || (steps.diaria.outputs.fallo == 'true' && steps.decidir.outputs.captura_sin_diaria == 'true')
        env:
          RAMA: ${{ steps.decidir.outputs.rama }}
        run: |
          # `reloj=true`: se trata como la captura programada (respeta la marca de «captura horaria activa»).
          if ! gh workflow run incremental.yml --ref "$RAMA" -f prueba=false -f reloj=true; then
            echo "::warning::No se pudo pedir la captura horaria (¿el flujo «Captura horaria» está desactivado?)."
          fi
      - name: Pedir el Vigía de avisos
        # P-13.1: una vez al día desde las 10:30 de Bogotá (buscador/arranque.py, toca_vigia). Va al final y no pone
        # el relevo en rojo: la cadena ya siguió y un tropiezo aquí lo cubre el horario propio de vigia.yml.
        if: steps.decidir.outputs.actuar == 'true'
        continue-on-error: true
        env:
          RAMA: ${{ steps.decidir.outputs.rama }}
        run: |
          lista="$RUNNER_TEMP/vigias.json"
          gh run list --workflow vigia.yml --limit 20 --json databaseId,status,conclusion,createdAt,event,headBranch > "$lista" || exit 0
          if python3 -m buscador.arranque --avisos "$lista" --rama "$RAMA" | grep -qx 'vigia=true'; then
            gh workflow run vigia.yml --ref "$RAMA" || echo "::warning::No se pudo pedir el Vigía de avisos."
          fi
      - name: Avisar si falta el temporizador
        # En rojo solo cuando lo arrancó una persona: antes de configurar el entorno, los intentos automáticos no
        # deben llenar el historial de fallos.
        if: steps.decidir.outputs.falta_temporizador == 'true' && github.event_name == 'workflow_dispatch' && inputs.origen == 'manual'
        run: |
          echo "::error::El entorno «reloj» no tiene su temporizador de espera. Ver docs/ACTIVAR_RELOJ.md."
          exit 1

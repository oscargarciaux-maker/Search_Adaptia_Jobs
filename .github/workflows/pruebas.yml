name: Pruebas

# En cada push y PR: pruebas Python y PostgreSQL del scraper y la persistencia.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install --require-hashes -r requirements.txt
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: panel-navegador
          path: web/test-results/
          retention-days: 7
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prueba-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: prueba-ci
      ADAPTIA_PRUEBA_SQL: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Probar migración, repetición e integridad sin Supabase
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/esquema.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/002_catalogo.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/002_catalogo.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f pruebas/catalogo_integracion.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/003_estado_operativo.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/003_estado_operativo.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f pruebas/estado_operativo_integracion.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/004_consulta_vigente.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/004_consulta_vigente.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f pruebas/consulta_vigente_integracion.sql
          # Usar pg_dump/pg_restore 17 del mismo contenedor, sin depender de la versión del runner.
          python3 pruebas/probar_concurrencia_estado.py --docker "${{ job.services.postgres.id }}"
          python -m pruebas.probar_migraciones
          python -m pruebas.probar_ofertas_unicas
          python -m pruebas.probar_panel
          python -m pruebas.probar_traspaso
          python -m pruebas.probar_limpieza
          python -m pruebas.probar_revision
          python -m pruebas.probar_inventario
          python -m pruebas.probar_lote_grande
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m pytest -q
  auditoria:
    # PR 1.5 (16 nov): bloquea lo grave (errores de Python, vulnerabilidades conocidas, seguridad alta); lo demás informa.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install --require-hashes -r requirements-auditoria.txt
      - name: Errores de Python (ruff)
        run: ruff check buscador panel pruebas
      - name: Dependencias de Python con vulnerabilidades conocidas (pip-audit)
        run: pip-audit -r requirements.txt --disable-pip --no-deps
      - name: Seguridad del código, severidad alta (bandit)
        run: bandit -q -c pyproject.toml -r buscador panel -lll
      - name: Código sin uso (vulture, solo informa)
        continue-on-error: true
        run: vulture
      - run: npm ci
        working-directory: web
      - name: Reglas de React y accesibilidad (eslint)
        run: npm run lint
        working-directory: web
      - name: Archivos, exports y dependencias sin uso (knip, solo informa)
        continue-on-error: true
        run: npm run sobrante
        working-directory: web
      - name: Dependencias web con vulnerabilidades altas (npm audit)
        run: npm audit --audit-level=high --omit=dev
        working-directory: web

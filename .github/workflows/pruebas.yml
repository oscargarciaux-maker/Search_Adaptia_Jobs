name: Pruebas

# En cada push y PR: un cambio que rompa algo no se fusiona. Python (buscador/) y JavaScript (web/motor.js).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --test pruebas/*.test.js

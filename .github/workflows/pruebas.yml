name: Pruebas

# En cada push y PR: pruebas Python y PostgreSQL del scraper y la persistencia.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prueba-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: prueba-ci
      ADAPTIA_PRUEBA_SQL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probar migración, repetición e integridad sin Supabase
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create role service_role bypassrls;'
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/esquema.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/002_catalogo.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/002_catalogo.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f pruebas/catalogo_integracion.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/003_estado_operativo.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/003_estado_operativo.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f pruebas/estado_operativo_integracion.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/004_consulta_vigente.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f supabase/migraciones/004_consulta_vigente.sql
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f pruebas/consulta_vigente_integracion.sql
          # Usar pg_dump/pg_restore 17 del mismo contenedor, sin depender de la versión del runner.
          python3 pruebas/probar_concurrencia_estado.py --docker "${{ job.services.postgres.id }}"
          python -m pruebas.probar_migraciones
          python -m pruebas.probar_ofertas_unicas
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

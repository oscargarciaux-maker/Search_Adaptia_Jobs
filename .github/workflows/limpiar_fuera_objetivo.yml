name: Revisar y limpiar vacantes fuera del objetivo

# Contrato v13 (docs/CONTRATO_DATOS_v13.md). Paso 1: lanzarla sin marcar «aplicar». No cambia nada: deja el listado en
# Artifacts → listado-para-revisar (abrir revision.html) y una huella en el resumen. Paso 2: tras revisar, lanzarla otra
# vez con «aplicar», la huella, los números a conservar (si los hay), los de «revisar» que también quieras borrar y
# BORRAR. Antes de aplicar guarda una copia cifrada de las tablas (90 días).
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar (sin marcar: solo genera el listado para revisar)"
        type: boolean
        default: false
      huella:
        description: "Huella del listado que revisaste (sale en el resumen de la revisión)"
        type: string
        default: ""
      conservar:
        description: "Números de «Propuestas para borrar» que NO quieres borrar (separados por comas)"
        type: string
        default: ""
      borrar_tambien:
        description: "Números de «Para revisar a mano» que SÍ quieres borrar (separados por comas)"
        type: string
        default: ""
      confirmar:
        description: "Para aplicar, escribe BORRAR"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  limpiar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar la confirmación
        if: inputs.aplicar
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          HUELLA: ${{ inputs.huella }}
        run: |
          if [ "$CONFIRMAR" != "BORRAR" ] || [ -z "$HUELLA" ]; then
            echo "::error::Para aplicar escribe BORRAR en «confirmar» y copia la huella del listado revisado. No se cambió nada."
            exit 1
          fi
      - name: Traer el estado de trabajo (rama publicado)
        if: inputs.aplicar
        run: |
          if git ls-remote --exit-code --heads origin publicado; then
            git clone --depth 1 --branch publicado "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" salida
            rm -rf salida/.git
          else
            mkdir -p salida
          fi
      - name: Copia cifrada antes de cambiar nada
        if: inputs.aplicar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_BACKUP_KEY: ${{ secrets.SUPABASE_BACKUP_KEY }}
        run: python -m buscador.traspaso --fase respaldo --salida salida --privado privado
      - name: Conservar la copia 90 días
        if: inputs.aplicar
        uses: actions/upload-artifact@v6
        with:
          name: respaldo-antes-de-limpiar-${{ github.run_id }}
          path: privado/respaldos/*.enc
          if-no-files-found: error
          retention-days: 90
      - name: Revisar (o aplicar)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CONFIRMAR: ${{ inputs.confirmar }}
          HUELLA: ${{ inputs.huella }}
          CONSERVAR: ${{ inputs.conservar }}
          BORRAR_TAMBIEN: ${{ inputs.borrar_tambien }}
        run: |
          if [ "${{ inputs.aplicar }}" = "true" ]; then
            python -m buscador.limpiar_fuera_objetivo --aplicar --confirmar "$CONFIRMAR" --huella "$HUELLA" \
              --conservar "$CONSERVAR" --borrar-tambien "$BORRAR_TAMBIEN"
          else
            # Sin «aplicar» solo revisa; si se escribieron datos para borrar, el resumen avisa que no se borró nada.
            python -m buscador.limpiar_fuera_objetivo --huella "$HUELLA" --conservar "$CONSERVAR" \
              --borrar-tambien "$BORRAR_TAMBIEN" --confirmar "$CONFIRMAR"
          fi
      - name: Guardar el listado para revisar (30 días)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: listado-para-revisar
          path: revision/
          if-no-files-found: ignore
          retention-days: 30

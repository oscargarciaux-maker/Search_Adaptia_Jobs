name: Actualizar página

# GITHUB_TOKEN al escribir publicado no reconstruye Pages legacy. Desplegar explícitamente después de capturar.
# Activación: Settings > Pages > Source: GitHub Actions y variable PAGES_POR_ACTIONS=true.
on:
  workflow_run:
    workflows: [Bodega nocturna, Captura horaria, Búsqueda profunda]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: false

jobs:
  desplegar:
    if: ${{ vars.PAGES_POR_ACTIONS == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publicado
          persist-credentials: false
      - name: Preparar solo los archivos de la página
        run: |
          mkdir -p sitio/datos
          cp index.html estilos.css app.js motor.js config.js sitio/
          cp datos/vacantes.json.gz datos/mapa.json datos/paises.json datos/salud.json sitio/datos/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: sitio
      - uses: actions/deploy-pages@v4
        id: despliegue

name: Copia de seguridad semanal

# Copia cifrada de las tablas del sistema, sus secuencias y la carpeta de trabajo. Se guarda en el bucket PRIVADO
# `respaldos` de Supabase Storage (buscador/almacen_respaldos.py): quedan las últimas 2 semanas (27 nov).
# Complementa (no sustituye) las copias diarias que Supabase incluye en sus planes de pago.
# Usa SUPABASE_DB_URL y SUPABASE_BACKUP_KEY; sin la clave de cifrado la copia no se puede leer: guardarla aparte.
# Domingos 5:41 a. m. de Bogotá (10:41 UTC). A mano: Actions > Copia de seguridad semanal > Run workflow.
on:
  schedule:
    - cron: "41 10 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  respaldo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - name: Traer el estado de trabajo (rama publicado)
        run: |
          if git ls-remote --exit-code --heads origin publicado; then
            git clone --depth 1 --branch publicado "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" salida
            rm -rf salida/.git
          else
            mkdir -p salida
          fi
      - name: Crear copia cifrada
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_BACKUP_KEY: ${{ secrets.SUPABASE_BACKUP_KEY }}
        run: python -m buscador.traspaso --fase respaldo --salida salida --privado privado
      - name: Guardar la copia en Storage privado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m buscador.almacen_respaldos subir --tipo semanal --carpeta privado/respaldos
      # Red de seguridad TEMPORAL (27 nov): hasta confirmar en real la primera subida a Storage. El repo es público:
      # 1 día y no 90. Oscar decide quitarla tras una corrida real correcta.
      - name: Red de seguridad temporal (1 día)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: respaldo-semanal-${{ github.run_id }}
          path: privado/respaldos/*.enc
          if-no-files-found: ignore
          retention-days: 1
      - name: Avisar
        if: always()
        env:
          AVISO: ${{ secrets.AVISO_RESPALDO_URL }}
        run: |
          if [ -n "$AVISO" ]; then
            if [ "${{ job.status }}" = "success" ]; then curl -fsS -m 10 --retry 3 "$AVISO" >/dev/null || true
            else curl -fsS -m 10 --retry 3 "$AVISO/fail" >/dev/null || true; fi
          fi

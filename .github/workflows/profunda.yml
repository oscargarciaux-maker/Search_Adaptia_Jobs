name: Búsqueda profunda

# Busca en vivo un cargo (y sus parecidos del mapa) en todas las fuentes, lo suma a la bodega y vuelve a publicar.
# La lanza la página (botón "Búsqueda profunda", con Cloudflare) o se corre a mano: Actions > Búsqueda profunda > Run workflow.
on:
  workflow_dispatch:
    inputs:
      consulta:
        description: "Cargo a buscar (ej.: editor de video, product designer)"
        required: true
        type: string
      pais:
        description: "Código del país (CO, VE, MX…) o vacío para toda LATAM"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  profunda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Traer la bodega publicada
        run: |
          if git ls-remote --exit-code --heads origin publicado; then
            git clone --depth 1 --branch publicado "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" salida
            rm -rf salida/.git
          else
            mkdir -p salida
          fi
      - name: Buscar
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONSULTA: ${{ inputs.consulta }}
          PAIS: ${{ inputs.pais }}
        run: python -m buscador.bodega --salida salida --consulta "$CONSULTA" --pais "$PAIS"
      - name: Publicar
        working-directory: salida
        run: |
          git init -q
          git checkout -q -b publicado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Búsqueda profunda $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" publicado

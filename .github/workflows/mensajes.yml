name: Mensajes de WhatsApp

# Respaldo diario (10:15 a. m. Bogotá, después de la pasada de las 8:30): prepara el borrador de cada cliente con WhatsApp y consentimiento si la búsqueda
# de la noche o la pasada de la mañana no lo hicieron. Nada se envía: el operador lo abre en WhatsApp desde el panel.
on:
  schedule:
    - cron: "15 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mensajes
  cancel-in-progress: false

jobs:
  borradores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Preparar borradores del día
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then echo "Sin Supabase: nada que preparar."; exit 0; fi
          python -m panel.borradores

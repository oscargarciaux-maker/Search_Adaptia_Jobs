name: Diagnóstico

# Revisa la configuración, cada fuente, Supabase, las claves de Apify y Brave y la última bodega publicada.
# A mano: Actions > Diagnóstico > Run workflow. El resultado queda en el resumen de la corrida.
on:
  workflow_dispatch:
    inputs:
      auditar_producto:
        description: "Conteos reales por rol y estado de una URL pública; solo lectura, sin Apify"
        type: boolean
        default: false
      vacante_url:
        description: "URL pública opcional para la auditoría; nunca una conexión o contraseña"
        type: string
        default: ""
      solo_conexion_db:
        description: "Probar contraseña/conexión PostgreSQL en solo lectura, sin migraciones ni Apify"
        type: boolean
        default: false
      solo_supabase:
        description: "Comprobar solo conexión y esquema de Supabase, sin escribir ofertas"
        type: boolean
        default: false
      probar_apify:
        description: "Prueba explícita de una oferta LinkedIn: cargo máximo USD 0,01; sin guardar en Supabase"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comprobar conexión administrativa en solo lectura
        if: ${{ !inputs.auditar_producto && inputs.solo_conexion_db }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python -m buscador.diagnostico_conexion
      - name: Auditar roles y estado actual sin escribir
        if: ${{ inputs.auditar_producto }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VACANTE_PUBLICA_URL: ${{ inputs.vacante_url }}
        run: python -m buscador.auditoria_producto
      - name: Revisar
        if: ${{ !inputs.auditar_producto && !inputs.solo_conexion_db && !inputs.solo_supabase && !inputs.probar_apify }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m buscador.diagnostico
      - name: Comprobar Supabase sin escribir
        if: ${{ !inputs.auditar_producto && !inputs.solo_conexion_db && inputs.solo_supabase && !inputs.probar_apify }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -c "from buscador.supabase import exigir_conexion; print(exigir_conexion())"
      - name: Probar una oferta LinkedIn con Apify
        if: ${{ !inputs.auditar_producto && !inputs.solo_conexion_db && inputs.probar_apify }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m buscador.diagnostico_apify
